services:
  netdeploy:
    build: .
    container_name: netdeploy-ai
    restart: unless-stopped
    ports:
      - '127.0.0.1:8787:8787'
    environment:
      VPSDEPLOY_ADMIN_TOKEN: ${VPSDEPLOY_ADMIN_TOKEN:-${NETDEPLOY_ADMIN_TOKEN:-}}
      VPSDEPLOY_DATA: /srv/vpsdeploy/data
      VPSDEPLOY_CODEX_WORKER_URL: http://codex-worker:8788
      VPSDEPLOY_WORKER_TOKEN: ${VPSDEPLOY_WORKER_TOKEN:-${NETDEPLOY_WORKER_TOKEN:-}}
      VPSDEPLOY_SSH_KEY_FILE: /run/secrets/ssh_key
    volumes:
      - ./data:/srv/netdeploy/data
      # Directory exists even when using password-only authentication.
      # Optional dedicated private key at ./secrets/ssh_key for key login.
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

  codex-worker:
    profiles: ["ai"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.ai
    environment:
      VPSDEPLOY_WORKER_TOKEN: ${VPSDEPLOY_WORKER_TOKEN:-${NETDEPLOY_WORKER_TOKEN:-}}
      # The user connects ChatGPT inside the panel (device authorization).
      # No API key is forwarded and no extra API billing is configured.
      CODEX_HOME: /home/agent/.codex
    volumes:
      - codex-auth:/home/agent/.codex
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    # No external port, no SSH key mount, no database, no Docker socket.

volumes:
  # Isolated Codex login cache; Docker manages the mount and its permissions.
  # Treat as a sensitive credential store; never mount on the main API service.
  codex-auth:
